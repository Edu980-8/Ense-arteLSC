services:
  prestart:
    image: ensenarte-backend:latest
    entrypoint: ["bash", "/app/scripts/prestart.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: local
    volumes:
      - ./scripts:/app/scripts
      - ./app:/app/app
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./alembic.ini:/app/alembic.ini
  backend:
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./alembic.ini:/app/alembic.ini
    environment:
      ENV: "local"
      POSTGRES_SERVER: "db"
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    depends_on:
      prestart:
        condition: service_completed_successfully
      mailcatcher:
        condition: service_started
      

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ensenarte_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1025:1025"  # SMTP
      - "1080:1080"  # Web UI

volumes:
  pgdata:
